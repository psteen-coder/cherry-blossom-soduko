name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, bolt/**]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install and test web app
        run: |
          npm ci
          npm test
          npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Copy APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/CherryBlossomSoduko.apk
          ls -l artifacts/CherryBlossomSoduko.apk
          sha256sum artifacts/CherryBlossomSoduko.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CherryBlossomSoduko.apk
          path: artifacts/CherryBlossomSoduko.apk
          if-no-files-found: error
